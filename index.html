<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Botella UAI – Realidad Aumentada</title>

  <!-- A-Frame 1.3.0 + AR.js 3.4.5 (marcadores de patrón) -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    /* Sin color de fondo: AR.js dibuja el video de la cámara detrás del body */
    html, body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
    .overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,0,0,.85); color: #fff; text-align: center; padding: 16px;
    }
    .spinner {
      width: 48px; height: 48px; border: 4px solid #555; border-top-color: #fff;
      border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #hint {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 9;
      background: rgba(0,0,0,.6); color: #fff; padding: 8px 14px; border-radius: 8px;
      font-size: 14px; pointer-events: none; transition: opacity .3s;
    }
    #hint.hidden { opacity: 0; }
    #marker-link {
      position: fixed; top: 12px; right: 12px; z-index: 9;
      background: rgba(0,0,0,.6); color: #fff; padding: 8px 12px; border-radius: 8px;
      font-size: 14px; text-decoration: none;
    }
  </style>
</head>

<body>
  <div id="loader" class="overlay">
    <div class="spinner"></div>
    <div id="loader-text">Cargando modelo 3D…</div>
  </div>
  <div id="hint">Apunta la cámara al marcador AR</div>
  <a id="marker-link" href="assets/marcador.png" target="_blank" rel="noopener">Ver marcador</a>

  <script>
    // Parámetros por URL, ej: index.html?altura=1.5&debug=1
    const params = new URLSearchParams(location.search);
    window.AR_CFG = {
      // Altura del modelo en "lados de marcador" (1 = mismo ancho que el cuadrado negro)
      altura: parseFloat(params.get('altura')) || 1.2,
      debug: params.has('debug'),
    };

    // El GLB trae la escena completa de KeyShot (3 botellas, varios pedestales, fondo, cámara y luces).
    // Solo se muestran estos objetos: la botella de pie y su pedestal blanco.
    const OBJETOS_VISIBLES = ['Document_n3d', 'Cylinder_2'];

    // Escala lo visible a la altura deseada, lo centra y apoya su base sobre el marcador
    AFRAME.registerComponent('auto-fit', {
      schema: { height: { type: 'number', default: 1.2 } },
      init() {
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if (!obj) return;
          const lights = [];
          obj.traverse(o => { if (o.isLight) lights.push(o); });
          lights.forEach(l => l.parent.remove(l));
          obj.children.forEach(c => { c.visible = OBJETOS_VISIBLES.includes(c.name); });

          // Caja de lo visible, en coordenadas del modelo (antes de escalar)
          obj.scale.set(1, 1, 1);
          obj.position.set(0, 0, 0);
          obj.updateMatrixWorld(true);
          const toLocal = new THREE.Matrix4().copy(obj.matrixWorld).invert();
          const box = new THREE.Box3();
          obj.children.forEach(c => {
            if (c.visible) c.traverse(o => {
              if (o.isMesh) box.union(new THREE.Box3().setFromObject(o).applyMatrix4(toLocal));
            });
          });

          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());
          const s = this.data.height / (size.y || 1);
          obj.scale.setScalar(s);
          obj.position.set(-center.x * s, -box.min.y * s, -center.z * s);

          document.getElementById('loader').style.display = 'none';
        });
        this.el.addEventListener('model-error', () => {
          document.getElementById('loader-text').textContent = 'Error al cargar el modelo 3D.';
        });
      }
    });

    AFRAME.registerComponent('marker-events', {
      init() {
        const hint = document.getElementById('hint');
        this.el.addEventListener('markerFound', () => hint.classList.add('hidden'));
        this.el.addEventListener('markerLost', () => hint.classList.remove('hidden'));
        if (window.AR_CFG.debug) {
          const plane = document.createElement('a-plane');
          plane.setAttribute('rotation', '-90 0 0');
          plane.setAttribute('material', 'color: #00aaff; opacity: 0.4; transparent: true; side: double');
          this.el.appendChild(plane);
        }
      }
    });
  </script>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true; physicallyCorrectLights: true; antialias: true"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; patternRatio: 0.5;">

    <a-assets timeout="60000">
      <a-asset-item id="botella" src="assets/models/botella.glb"></a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; intensity: 2" position="1 2 1"></a-entity>

    <!-- Marcador de patrón "AR" -->
    <a-marker type="pattern" url="assets/patt/marcador.patt" smooth="true" smoothCount="5" marker-events>
      <!-- rotation: deja el logo UAI mirando hacia quien sostiene la cámara -->
      <a-entity gltf-model="#botella" auto-fit rotation="0 -45 0"></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
  <script>
    document.querySelector('[auto-fit]').setAttribute('auto-fit', 'height', window.AR_CFG.altura);
  </script>
</body>
</html>
